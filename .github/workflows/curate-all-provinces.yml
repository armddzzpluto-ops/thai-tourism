name: Curate all province galleries

# Curate three verified gallery images per province — alias retry
on:
  workflow_dispatch:
  push:
    branches:
      - agent/image-phase-1-run
    paths:
      - .github/workflows/curate-all-provinces.yml

permissions:
  contents: write

concurrency:
  group: image-curation-all-provinces
  cancel-in-progress: true

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out curation branch
        uses: actions/checkout@v4
        with:
          ref: agent/image-phase-1-run
          fetch-depth: 1

      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Curate and commit all 77 provinces in resumable batches
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item assets/images/provinces/curation-error.txt -Force -ErrorAction SilentlyContinue

          1..77 | ForEach-Object {
            $batch = $_
            try {
              & ./scripts/curate-province-gallery-batch.ps1 -BatchIndex $batch -BatchSize 1 -TargetGallery 3 -WebpQuality 82 -RequestDelayMs 1000
            } catch {
              $diagnostic = ($_ | Out-String) + [Environment]::NewLine + $_.ScriptStackTrace
              Set-Content -Path assets/images/provinces/curation-error.txt -Value $diagnostic -Encoding UTF8
              git add assets/images/provinces/curation-error.txt
              git commit -m "ci(images): record curation failure at item $batch"
              git push origin HEAD:agent/image-phase-1-run
              throw
            }
            node scripts/sync-image-curation.mjs
            node scripts/check-site.mjs

            git add assets/images/provinces js/image-curation-data.js
            if (-not (git diff --cached --quiet)) {
              git commit -m "feat(images): curate province gallery item $batch"
              git push origin HEAD:agent/image-phase-1-run
            } else {
              Write-Host "No changes for batch $batch"
            }
          }

      - name: Require all provinces to pass curation
        run: |
          node -e "const fs=require('fs');const rows=JSON.parse(fs.readFileSync('assets/images/provinces/validation-report.json','utf8').replace(/^\uFEFF/,''));const pending=rows.filter(x=>x.status!=='complete'||Number(x.fallbackCount)!==0||Number(x.galleryCount)<3);console.log('Complete:',rows.length-pending.length+'/'+rows.length);if(pending.length){console.error('Pending:',pending.map(x=>x.slug+':'+x.status).join(', '));process.exit(1)}"
