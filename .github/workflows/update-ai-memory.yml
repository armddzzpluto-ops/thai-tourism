name: Update AI memory

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Completed phase name
        required: true
      summary:
        description: Concise completed-work summary
        required: true

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Update memory
        env:
          PHASE: ${{ inputs.phase }}
          SUMMARY: ${{ inputs.summary }}
        run: node scripts/maintenance/update-ai-memory.mjs "$PHASE" "$SUMMARY"
      - name: Commit checkpoint
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/AI_MEMORY.md
          git diff --cached --quiet || git commit -m "docs(memory): checkpoint $PHASE"
          git push
